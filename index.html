<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天吃什么？</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .container {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
    padding: 36px 28px;
    width: 100%;
    max-width: 480px;
  }

  h1 {
    text-align: center;
    font-size: 26px;
    color: #333;
    margin-bottom: 6px;
  }

  .subtitle {
    text-align: center;
    color: #888;
    font-size: 13px;
    margin-bottom: 22px;
  }

  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  input[type="text"] {
    flex: 1;
    padding: 12px 16px;
    border: 2px solid #f0f0f0;
    border-radius: 12px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="text"]:focus {
    border-color: #fcb69f;
  }

  button {
    cursor: pointer;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    transition: transform 0.1s, box-shadow 0.2s, opacity 0.2s, background 0.2s;
  }

  button:active {
    transform: scale(0.97);
  }

  .add-btn {
    padding: 12px 20px;
    background: #ffb088;
    color: #fff;
  }

  .add-btn:hover {
    background: #ff9c6a;
  }

  details.suggestions {
    margin-bottom: 16px;
  }

  details.suggestions summary {
    cursor: pointer;
    color: #c0844a;
    font-size: 13px;
    padding: 6px 4px;
    user-select: none;
    list-style: none;
  }

  details.suggestions summary::-webkit-details-marker { display: none; }

  details.suggestions summary::before {
    content: '▸ ';
    display: inline-block;
    transition: transform 0.2s;
  }
  details.suggestions[open] summary::before {
    transform: rotate(90deg);
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 10px 4px 0;
  }

  .chip {
    padding: 6px 12px;
    background: #fff5e1;
    color: #c0844a;
    border-radius: 16px;
    font-size: 13px;
    font-weight: 500;
  }

  .chip:hover:not(:disabled) {
    background: #ffe0c0;
  }

  .chip:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .food-list {
    list-style: none;
    margin-bottom: 12px;
    max-height: 220px;
    overflow-y: auto;
  }

  .food-list:empty::before {
    content: "列表是空的，点上面的推荐或自己输入~";
    display: block;
    text-align: center;
    color: #bbb;
    padding: 20px 0;
    font-size: 13px;
  }

  .food-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: #faf7f4;
    border-radius: 10px;
    margin-bottom: 6px;
    font-size: 15px;
    color: #444;
    animation: slideIn 0.25s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .delete-btn {
    background: transparent;
    color: #c66;
    padding: 4px 10px;
    font-size: 18px;
    line-height: 1;
  }

  .delete-btn:hover {
    background: #fde;
  }

  .count {
    text-align: center;
    color: #888;
    font-size: 12px;
    margin-bottom: 12px;
  }

  .choose-btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #ff7e5f, #feb47b);
    color: #fff;
    font-size: 17px;
    box-shadow: 0 6px 16px rgba(255, 126, 95, 0.35);
    margin-bottom: 10px;
  }

  .choose-btn:hover:not(:disabled) {
    box-shadow: 0 8px 20px rgba(255, 126, 95, 0.45);
  }
  .choose-btn:disabled {
    background: #ddd;
    box-shadow: none;
    cursor: not-allowed;
  }

  .surprise-btn {
    width: 100%;
    padding: 14px;
    background: #fff;
    color: #ff7e5f;
    border: 2px solid #feb47b;
    font-size: 15px;
  }

  .surprise-btn:hover:not(:disabled) { background: #fff5e1; }
  .surprise-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .actions {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 14px;
  }

  .link-btn {
    background: transparent;
    color: #999;
    font-size: 12px;
    padding: 4px 8px;
    font-weight: 400;
    text-decoration: underline;
  }

  .link-btn:hover { color: #666; }

  .result {
    margin-top: 22px;
    text-align: center;
    min-height: 60px;
  }

  .result-rolling {
    font-size: 22px;
    color: #ff7e5f;
    font-weight: 600;
    animation: shake 0.15s infinite;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }

  .result-final {
    padding: 20px;
    background: linear-gradient(135deg, #fff5e1, #ffe0c0);
    border-radius: 14px;
    animation: pop 0.4s ease;
  }

  @keyframes pop {
    0% { transform: scale(0.6); opacity: 0; }
    60% { transform: scale(1.08); }
    100% { transform: scale(1); opacity: 1; }
  }

  .result-label {
    font-size: 13px;
    color: #c0844a;
    margin-bottom: 6px;
  }

  .result-food {
    font-size: 26px;
    font-weight: 700;
    color: #d4602a;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>🍜 今天吃什么？</h1>
    <p class="subtitle">列表存在浏览器里，下次打开还在</p>

    <div class="input-row">
      <input type="text" id="foodInput" placeholder="输入食物名字，按回车添加" autocomplete="off">
      <button class="add-btn" id="addBtn">添加</button>
    </div>

    <details class="suggestions" open>
      <summary>推荐添加（点一下进列表）</summary>
      <div class="chips" id="suggestionChips"></div>
    </details>

    <ul class="food-list" id="foodList"></ul>
    <p class="count" id="count"></p>

    <button class="choose-btn" id="chooseBtn">帮我选！</button>
    <button class="surprise-btn" id="surpriseBtn">🎁 Surprise Me（从常见食物里随机抽）</button>

    <div class="actions">
      <button class="link-btn" id="resetBtn">恢复默认</button>
      <button class="link-btn" id="clearBtn">清空全部</button>
    </div>

    <div class="result" id="result"></div>
  </div>

<script>
  const STORAGE_KEY = 'chooseFood.foods';

  const DEFAULT_FOODS = [
    '麻辣烫', '兰州拉面', '黄焖鸡米饭', '沙县小吃', '螺蛳粉',
    '火锅', '烧烤', '炒饭', '盖浇饭', '米线'
  ];

  const SURPRISE_POOL = [
    '麻辣烫', '兰州拉面', '黄焖鸡米饭', '沙县小吃', '螺蛳粉', '火锅', '烧烤',
    '寿司', '披萨', '汉堡', '炒饭', '盖浇饭', '米线', '馄饨', '饺子',
    '麻辣香锅', '酸菜鱼', '日料', '韩餐', '泰餐', '炒面', '凉皮',
    '肉夹馍', '煎饼果子', '小笼包', '生煎包', '锅贴', '羊肉泡馍',
    '麻婆豆腐', '宫保鸡丁', '红烧肉', '糖醋里脊', '回锅肉', '水煮鱼',
    '担担面', '炸酱面', '热干面', '重庆小面', '过桥米线',
    '鱼香肉丝', '烤肉', '寿喜烧', '关东煮', '咖喱饭', '牛肉面',
    '酸辣粉', '冒菜', '三明治', '韩式拌饭', '部队锅', '石锅拌饭',
    '炸鸡', '烤鱼', '小龙虾'
  ];

  const SUGGESTION_CHIPS = SURPRISE_POOL.slice(0, 24);

  const foodInput = document.getElementById('foodInput');
  const addBtn = document.getElementById('addBtn');
  const foodList = document.getElementById('foodList');
  const countEl = document.getElementById('count');
  const chooseBtn = document.getElementById('chooseBtn');
  const surpriseBtn = document.getElementById('surpriseBtn');
  const resultEl = document.getElementById('result');
  const chipsEl = document.getElementById('suggestionChips');
  const resetBtn = document.getElementById('resetBtn');
  const clearBtn = document.getElementById('clearBtn');

  function loadFoods() {
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored === null) return [...DEFAULT_FOODS];
      const parsed = JSON.parse(stored);
      return Array.isArray(parsed) ? parsed : [...DEFAULT_FOODS];
    } catch {
      return [...DEFAULT_FOODS];
    }
  }

  function saveFoods() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(foods));
    } catch {}
  }

  let foods = loadFoods();

  function renderList() {
    foodList.innerHTML = '';
    foods.forEach((food, idx) => {
      const li = document.createElement('li');
      li.className = 'food-item';

      const span = document.createElement('span');
      span.textContent = food;

      const btn = document.createElement('button');
      btn.className = 'delete-btn';
      btn.textContent = '×';
      btn.title = '删除';
      btn.addEventListener('click', () => {
        foods.splice(idx, 1);
        saveFoods();
        render();
      });

      li.appendChild(span);
      li.appendChild(btn);
      foodList.appendChild(li);
    });

    countEl.textContent = foods.length > 0 ? `一共 ${foods.length} 种选项` : '';
    chooseBtn.disabled = foods.length === 0;
  }

  function renderChips() {
    chipsEl.innerHTML = '';
    SUGGESTION_CHIPS.forEach(food => {
      const btn = document.createElement('button');
      btn.className = 'chip';
      btn.textContent = food;
      btn.disabled = foods.includes(food);
      btn.addEventListener('click', () => {
        if (foods.includes(food)) return;
        foods.push(food);
        saveFoods();
        render();
      });
      chipsEl.appendChild(btn);
    });
  }

  function render() {
    renderList();
    renderChips();
  }

  function addFood() {
    const value = foodInput.value.trim();
    if (!value) return;
    if (foods.includes(value)) {
      foodInput.value = '';
      return;
    }
    foods.push(value);
    foodInput.value = '';
    saveFoods();
    render();
    foodInput.focus();
  }

  function setRolling(text) {
    resultEl.innerHTML = '';
    const div = document.createElement('div');
    div.className = 'result-rolling';
    div.textContent = text;
    resultEl.appendChild(div);
  }

  function setFinal(food) {
    resultEl.innerHTML = '';
    const wrapper = document.createElement('div');
    wrapper.className = 'result-final';
    const label = document.createElement('div');
    label.className = 'result-label';
    label.textContent = 'OH MY GOD！吃它！！！';
    const foodEl = document.createElement('div');
    foodEl.className = 'result-food';
    foodEl.textContent = food;
    wrapper.appendChild(label);
    wrapper.appendChild(foodEl);
    resultEl.appendChild(wrapper);
  }

  function rollAndShow(pool) {
    if (pool.length === 0) return;
    chooseBtn.disabled = true;
    surpriseBtn.disabled = true;
    setRolling('🎲 请稍等...');

    let ticks = 0;
    const maxTicks = 14;
    const rolling = setInterval(() => {
      const pick = pool[Math.floor(Math.random() * pool.length)];
      setRolling('🎲 ' + pick);
      ticks++;
      if (ticks >= maxTicks) {
        clearInterval(rolling);
        const final = pool[Math.floor(Math.random() * pool.length)];
        setFinal(final);
        chooseBtn.disabled = foods.length === 0;
        surpriseBtn.disabled = false;
      }
    }, 80);
  }

  addBtn.addEventListener('click', addFood);
  foodInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addFood();
  });

  chooseBtn.addEventListener('click', () => rollAndShow(foods));
  surpriseBtn.addEventListener('click', () => rollAndShow(SURPRISE_POOL));

  resetBtn.addEventListener('click', () => {
    if (confirm('恢复默认列表？当前列表会被替换。')) {
      foods = [...DEFAULT_FOODS];
      saveFoods();
      render();
    }
  });

  clearBtn.addEventListener('click', () => {
    if (foods.length === 0) return;
    if (confirm('清空所有食物？')) {
      foods = [];
      saveFoods();
      render();
    }
  });

  render();
</script>
</body>
</html>
